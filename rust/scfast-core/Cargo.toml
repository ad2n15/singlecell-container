[package]
name = "scfast-core"
description = "Fast single-cell kernels (implicit-scaled PCA, kNN, SNN, Leiden) behind Seurat and Scanpy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
faer.workspace = true
rayon.workspace = true
rand.workspace = true
rand_chacha.workspace = true
thiserror.workspace = true
hnsw_rs.workspace = true
single-clustering.workspace = true
libloading = { workspace = true, optional = true }

[features]
# GPU Leiden through cuGraph's C API, loaded at runtime with dlopen (src/cugraph.rs). Compiles
# and tests without CUDA, cuGraph or a GPU; the library is only needed when a CUDA device is
# requested.
cugraph = ["dep:libloading"]

[dev-dependencies]
