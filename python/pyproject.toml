[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpipe"
version = "0.1.0"
description = "scpipe: runner, QC engine, exchange format and GPU core step for the singlecell pipeline"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py",
    "numpy",
    "scipy",
    "pandas",
    "igraph",
    "leidenalg",
    "pyyaml",
    "scikit-learn",
    "scikit-image",
    "jinja2",
    "celltypist",
    # Rust engine; prebuilt abi3 wheels (CUDA + cuGraph loaded at run time on Linux x86_64) from
    # https://mukeshkbj.github.io/singlecell/simple (pip --extra-index-url), built by .github/workflows/release.yml.
    "scfast",
    "umap-learn",
]

[project.scripts]
scpipe = "scpipe.runner:main"

[project.optional-dependencies]
harmony = ["harmonypy"]
# Prebuilt CUDA 12 wheels from https://pypi.nvidia.com (pip --extra-index-url); no nvcc needed.
gpu = ["rapids-singlecell-cu12", "cupy-cuda12x", "cuvs-cu12", "libcugraph-cu12"]
test = ["pytest"]
report = ["matplotlib"]
llm = ["requests"]
all = ["scpipe[harmony,report,llm,gpu]"]
# Building scfast from source instead of the prebuilt wheel (docs/INSTALL.md):
#   maturin develop --release -m rust/scfast-py/Cargo.toml
dev = ["maturin>=1.9.4,<2", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scpipe*"]
