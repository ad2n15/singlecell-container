[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpipe"
version = "0.1.0"
description = "Seurat <-> AnnData exchange format and GPU core step for the singlecell pipeline"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py",
    "numpy",
    "scipy",
    "pandas",
    "igraph",
    "leidenalg",
]

[project.optional-dependencies]
harmony = ["harmonypy"]
gpu = ["rapids-singlecell"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scpipe*"]
